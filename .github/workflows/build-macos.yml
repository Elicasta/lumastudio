name: Build macOS Studio
on:
  push:
    branches:
      - build/v0.4-presenter-planning-center
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install dependencies
        run: npm install
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Check native app
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build universal Studio DMG
        run: npm run tauri:build -- --target universal-apple-darwin --bundles app,dmg
      - name: Verify DMG
        run: |
          DMG_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH" || (echo "No DMG found" && exit 1)
          hdiutil verify "$DMG_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: LumaStudio-v0.4-ProPresenter-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
