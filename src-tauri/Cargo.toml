[package]
name = "lumarig-studio"
version = "0.1.0"
description = "LumaRig Studio"
authors = ["LumaRig Studio"]
edition = "2021"

[lib]
name = "lumarig_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
png = "0.18"

[dependencies]
arc-swap = "1.7"
audioadapter-buffers = "4.0"
cpal = "0.18.2"
hound = "3.5"
rubato = { version = "5.0", features = ["fft_resampler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2"
