[package]
name = "lumarig-studio"
version = "0.1.0"
description = "LumaRig Studio"
authors = ["LumaRig Studio"]
edition = "2021"

[lib]
name = "lumarig_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
png = "0.18"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
